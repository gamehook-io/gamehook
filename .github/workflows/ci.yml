name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gamehook-io/mappers
          path: .test-mappers
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        env:
          GAMEHOOK_TEST_MAPPERS: ${{ github.workspace }}/.test-mappers/dist
        # The test project, not the solution: the solution also holds the Android app, which needs
        # the Android workload and SDK (built by the android job below).
        run: dotnet test src/Gamehook.Tests -c Release --nologo
      - name: Test calendar release versions
        run: python .github/scripts/test_release_version.py

  # Proves the Android app still builds and signs. The APK is signed with a throwaway key.
  # Not on pushes: those only run the tests above.
  android:
    if: github.event_name != 'push'
    uses: ./.github/workflows/android.yml
    with:
      artifact_name: gamehook-android-ci
