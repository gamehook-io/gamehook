name: Android APK

# Reusable: builds, signs and stores the Android APK (sideload) and AAB (Google Play). Called by CI (every push/PR, throwaway
# signing key) and by Release (the real signing key from repository secrets).
on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Name of the uploaded artifact."
        type: string
        default: gamehook-android
      version:
        description: "Release version (yy.mm.N). Blank builds a development version."
        type: string
        default: ""
      mapper_commit:
        description: "gamehook-io/mappers commit to pin into the app. Blank tracks the main branch."
        type: string
        default: ""
      mapper_commit_date:
        description: "Committer date (ISO 8601 UTC) of mapper_commit."
        type: string
        default: ""
      require_signing_key:
        description: "True: sign only with the repository's keystore secret, and skip (with a warning) when it is not configured. False: fall back to a throwaway key."
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: "Base64 of the release keystore (.jks/.keystore)."
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: "Password for the keystore and its key."
        required: false
      ANDROID_KEY_ALIAS:
        description: "Alias of the signing key in the keystore."
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The signing key decides whether this job builds at all (see require_signing_key).
      - name: Prepare signing key
        id: key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REQUIRE: ${{ inputs.require_signing_key }}
        run: |
          keystore="$RUNNER_TEMP/gamehook.keystore"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            password="$KEYSTORE_PASSWORD"
            alias="$KEY_ALIAS"
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE" = "true" ]; then
            echo "::warning::Skipping the Android build: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS are not all set. A release APK must be signed with a stable key or it can never be updated in place."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            # Throwaway key: good enough to prove the APK builds and installs, not for distribution.
            password="$(openssl rand -hex 16)"
            alias="gamehook-ci"
            keytool -genkeypair -keystore "$keystore" -alias "$alias" -keyalg RSA -keysize 2048 \
              -validity 30 -dname "CN=Gamehook CI" -storepass "$password" -keypass "$password"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$password"
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Resolve version
        id: version
        if: steps.key.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "display=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$VERSION" =~ ^([0-9]{2})\.([0-9]{2})\.([1-9][0-9]{0,2})$ ]]; then
            echo "::error::Android versions must look like yy.mm.N with N below 1000; got '$VERSION'." >&2
            exit 1
          fi
          # Android's versionCode is one increasing integer: yy.mm.N -> yymmNNN (26.09.1 -> 2609001).
          code=$(( 10#${BASH_REMATCH[1]} * 100000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]} ))
          echo "display=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # The SDK is large (~1.5 GB); cache it keyed on the project so it only changes with the workload.
      - name: Cache Android SDK
        if: steps.key.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('src/Gamehook.Android/Gamehook.Android.csproj') }}

      - name: Install the Android workload and SDK
        if: steps.key.outputs.skip != 'true'
        shell: bash
        run: |
          dotnet workload install android
          dotnet build src/Gamehook.Android -f net10.0-android -t:InstallAndroidDependencies \
            -p:AndroidSdkDirectory="$RUNNER_TEMP/android-sdk" \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:AcceptAndroidSDKLicenses=True

      # Same key for both: the APK is sideloaded (GitHub releases); the AAB is what Google Play takes.
      - name: Publish signed APK and AAB
        if: steps.key.outputs.skip != 'true'
        shell: bash
        run: |
          for format in apk aab; do
            dotnet publish src/Gamehook.Android/Gamehook.Android.csproj \
              -c Release -f net10.0-android \
              -p:AndroidPackageFormat=$format \
              -p:AndroidSdkDirectory="$RUNNER_TEMP/android-sdk" \
              -p:JavaSdkDirectory="$JAVA_HOME" \
              -p:ApplicationDisplayVersion="${{ steps.version.outputs.display }}" \
              -p:ApplicationVersion="${{ steps.version.outputs.code }}" \
              -p:MapperCommit="${{ inputs.mapper_commit }}" \
              -p:MapperCommitDate="${{ inputs.mapper_commit_date }}" \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore="$KEYSTORE_PATH" \
              -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
              -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD \
              -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
          done

      # Gate: both files must exist and carry the key we meant to use before they are stored.
      - name: Verify APK and AAB
        if: steps.key.outputs.skip != 'true'
        shell: bash
        run: |
          publish=src/Gamehook.Android/bin/Release/net10.0-android/publish
          mkdir -p dist/android
          cp "$(ls $publish/*-Signed.apk)" dist/android/Gamehook.apk
          cp "$(ls $publish/*-Signed.aab)" dist/android/Gamehook.aab
          apksigner=$(ls "$RUNNER_TEMP"/android-sdk/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs dist/android/Gamehook.apk
          # The chain warning is expected: the key is self-signed, which is what Play App Signing wants as an upload key.
          jarsigner -verify dist/android/Gamehook.aab | head -1
          ls -l dist/android/

      - name: Store APK and AAB
        if: steps.key.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/android/
          if-no-files-found: error
          retention-days: ${{ steps.key.outputs.ephemeral == 'true' && 7 || 90 }}
